# Builds the Essence POS Windows app on GitHub's free Windows machines.
# Download it from the run's "Artifacts" section (essence-pos-windows), unzip, run essence_pos.exe.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['essence-pos/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: essence-pos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Tests
        run: flutter test

      - name: Build (bundles the VC++ runtime)
        run: powershell -ExecutionPolicy Bypass -File tool\build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: essence-pos-windows
          path: essence-pos/build/windows/x64/runner/Release/
          retention-days: 30
